# qemu sim printer.cfg — drives a REAL klippy against Klipper's Linux-process
# MCU (klipper_mcu, /tmp/klipper_host_mcu) so the host+MCU stack reaches "ready"
# with no physical N32G455 hardware. Used by the qemu harness to test the full
# stack (klippy <-> moonraker <-> OTA) without the fake-klippy API stand-in.
#
# Mirrors the real printer's TWO N32G455 MCUs: the main board ([mcu]) + the
# toolhead "eboard" ([mcu eboard]). Two klipper_mcu (Linux-process) instances,
# each on its own socket, stand in for them. kinematics: none -> no steppers/
# heaters to map onto the Linux MCUs' (host GPIO only) pin space, which is all
# this faithful "ready" check needs.

[mcu]
serial: /tmp/klipper_host_mcu

[mcu eboard]
serial: /tmp/klipper_eboard_mcu

[printer]
kinematics: none
max_velocity: 100
max_accel: 100
