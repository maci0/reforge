# ReForge printer configuration — FlashForge Adventurer 5M Pro
#
# This is the top-level config file passed to klippy:
#   klippy.py /etc/reforge/printer.cfg -a /tmp/klippy_uds -l /var/log/klippy.log
#
# printer.base.cfg contains the AD5M Pro board definition:
#   - N32G455 MCU (ttyS5) + eboard (ttyS1)
#   - CoreXY kinematics
#   - TMC2209 steppers (X/Y/Z + extruder)
#   - Hotend, bed, fans, probes, ADXL345
#
# Add machine-specific overrides or calibration sections below.

[include printer.base.cfg]

# ------------------------------------------------------------------
# Per-printer calibration — populate after first-boot with actual
# PID values, z_offset, bed_mesh profile, etc.
# ------------------------------------------------------------------

