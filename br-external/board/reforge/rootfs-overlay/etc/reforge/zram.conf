# ReForge zram swap configuration
# Sourced by /etc/init.d/S35zram at boot.
#
# ZRAM_ALGO — compression algorithm for the zram swap device.
#   Supported values (stock 5.4.61 kernel, zram.ko built from Allwinner BSP):
#     zstd    — best compression ratio (~4x); recommended default
#     lzo-rle — faster decompression, lower ratio (~2.7x)
#     lzo     — legacy; use lzo-rle instead
ZRAM_ALGO=zstd

# ZRAM_SIZE — virtual size of the zram swap disk.
#   The actual RAM used is typically 1/4 this value thanks to compression.
#   On a 512 MB board: 256M virtual → ~64 MB RAM pressure at full capacity.
ZRAM_SIZE=256M
