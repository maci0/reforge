# =============================================================================
# ReForge AD5M / AD5M Pro printer.base.cfg
#
# Rebased on the PRISTINE STOCK FlashForge config (extracted from the factory eMMC
# golden dump, == ZMod's native-v11 ff5m config). The earlier ReForge base.cfg had
# inherited xblax's (Klipper v0.13) form — [flashforge_loadcell]/[flashforge_tvoc]
# custom out-of-tree modules — which vanilla Klipper lacks. Stock/ZMod instead read
# the load cell + air sensor as STANDARD Klipper sensors (MAX31856 / MAX31865) and
# use a plain [probe] pin:!PB4, all vanilla-supported. See
# docs/2026-06-02-ad5m-mcu-firmware-and-config.md.
#
# Host↔MCU version note: this targets the native v11 MCU. The ONLY section with a
# v11↔v13 protocol skew is [adxl345] (the query_adxl345 command format changed) —
# it is left disabled below until ReForge's host Klipper is pinned to v0.11 OR the
# MCU is flashed to v0.13. Everything else (MAX sensors, probe, steppers, heaters)
# matches across versions.
# =============================================================================

[mcu eboard]
serial: /dev/ttyS1
baud: 230400
restart_method: command

[mcu]
serial: /dev/ttyS5
baud: 230400
restart_method: command

[stepper_x]
step_pin: PC1
dir_pin: PC0
enable_pin: !PA1
microsteps: 16
rotation_distance: 40
endstop_pin: !eboard:PA15
position_endstop: 110
position_max: 125
position_min: -125.0
homing_speed: 50
homing_retract_dist: 10
homing_retract_speed: 25

[stepper_y]
step_pin: PA3
dir_pin: PA2
enable_pin: !PA6
microsteps: 16
rotation_distance: 40
endstop_pin: !eboard:PB11
position_endstop: 110
position_max: 125.0
position_min: -125.0
homing_speed: 50
homing_retract_dist: 10
homing_retract_speed: 25

[stepper_z]
step_pin: PC4
dir_pin: PA7
enable_pin: !PB1
microsteps: 16
rotation_distance: 8
endstop_pin: PB15
position_endstop: 220
position_max: 230
position_min: -10
homing_speed: 20
homing_retract_dist: 5
homing_retract_speed: 10

[extruder]
step_pin: eboard:PB14
dir_pin: !eboard:PB15
enable_pin: !eboard:PB12
microsteps: 16
# AD5M stock value (forge-x printer.cfg). The FlashForge fork defaulted this; vanilla
# Klipper requires it. Per-unit calibrated value is ~4.4 (forge-x tuning.cfg) — re-tune
# with a 100 mm extrude + SAVE_CONFIG before real prints.
rotation_distance: 4.7
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: eboard:PA8
sensor_type: Generic 3950
sensor_pin: eboard:PA0
min_extrude_temp: 100
# Klipper requires a control algorithm + PID gains. Defaults from a known-good AD5M Pro
# (stock SAVE_CONFIG); re-run PID_CALIBRATE HEATER=extruder TARGET=240 + SAVE_CONFIG.
control: pid
pid_Kp: 38.331
pid_Ki: 6.084
pid_Kd: 60.372
min_temp: -100
max_temp: 350
pressure_advance: 0.035
pressure_advance_smooth_time: 0.040
max_extrude_only_distance: 1500.00
max_extrude_cross_section: 1000

[heater_bed]
heater_pin: PB9
sensor_type: Generic 3950
sensor_pin: PC3
pullup_resistor: 4700
# Defaults from a known-good AD5M Pro (stock); re-run PID_CALIBRATE HEATER=heater_bed
# TARGET=60 + SAVE_CONFIG per unit.
control: pid
pid_Kp: 32.79
pid_Ki: 4.970
pid_Kd: 54.118
max_power: 1.0
min_temp: -100
max_temp: 130

[verify_heater extruder]
max_error: 290
check_gain_time: 200
hysteresis: 10
heating_gain: 10

[verify_heater heater_bed]
max_error: 120
check_gain_time: 200
hysteresis: 10
heating_gain: 10

# -- Fans ---------------------------------------------------------------------
[heater_fan hotend_fan]
pin: eboard:PB4
max_power: 1.0
#kick_start_time: 0.5
heater: extruder
heater_temp: 50.0

# Part-cooling fan (stock routes M106 to this via a macro; ReForge maps it natively).
[fan]
pin: eboard:PB5

[fan_generic chamber_fan]
pin: PC6
hardware_pwm: True
enable_pin: PC7

[fan_generic internal_fan]
pin: PB8

[fan_generic external_fan]
pin: PB6

[controller_fan stepper_driver_fan]
pin: PB7
fan_speed: 1.0
idle_timeout: 30
stepper: stepper_x, stepper_y, stepper_z

[led chamber_led]
white_pin: PA8
hardware_pwm: False
initial_white: 1

# -- Power / shutdown button (purpose unconfirmed; surfaced read-only in the UI) ----
[gcode_button btn_power]
pin: !PC15
press_gcode:
    _SHUTDOWN_BUTTON_TRIGGER

[output_pin _power_off]
pin: PC14
value: 1
shutdown_value: 1

[output_pin _clear_power_off]
pin: PG1
value: 0
shutdown_value: 0

# -- Accelerometer / input shaping (ONLY version-locked section) --------------
# query_adxl345 changed format between Klipper v0.11 (native AD5M MCU) and v0.13:
#   v11 MCU:  query_adxl345 oid=%c rest_ticks=%u
#   v13 host: query_adxl345 oid=%c clock=%u rest_ticks=%u
# A v13 host against the native v11 MCU throws "MCU Protocol error: Command format
# mismatch" the moment klippy configures the accelerometer, so the host never reaches
# 'ready'. This is the ONE section that differs by MCU/host version — the rest of the
# config is version-independent. Enable this (stock values below) once ReForge's host
# Klipper matches the MCU: either pin the host to v0.11, or flash the MCU to v0.13
# (see docs/2026-06-02-ad5m-mcu-firmware-and-config.md, §7).
#[adxl345]
#cs_pin: eboard:PA4
#spi_speed: 1000000
##spi_bus: spi3
#spi_software_sclk_pin: eboard:PA5
#spi_software_mosi_pin: eboard:PA7
#spi_software_miso_pin: eboard:PA6
#axes_map: x, y, z
#rate: 800
#
#[resonance_tester]
#accel_chip: adxl345
#min_freq: 5
#max_freq: 100
#probe_points:
#        0,0,100

# Input shaping APPLIES preset shaper values via the normal stepper commands — it does
# NOT use query_adxl345, so it works even with [adxl345] disabled (only re-calibration,
# TEST_RESONANCES / SHAPER_CALIBRATE, needs the accelerometer + a matching MCU version).
# Defaults below are a known-good AD5M Pro calibration; re-run SHAPER_CALIBRATE once the
# accelerometer is enabled, then SAVE_CONFIG.
[input_shaper]
shaper_type_x: mzv
shaper_freq_x: 52.2
shaper_type_y: mzv
shaper_freq_y: 48.2

[idle_timeout]
timeout: 600

[pause_resume]
recover_velocity: 50

[printer]
kinematics: corexy
max_velocity: 600
max_accel: 20000
# v0.13 spelling (ReForge host). For a v0.11 host use `max_accel_to_decel: 5000`
# instead (stock value) — see the 20240313 upstream deprecation.
minimum_cruise_ratio: 0.5
max_z_velocity: 25
max_z_accel: 500
square_corner_velocity: 25

[tmc2209 stepper_x]
uart_pin: PC2
interpolate: True
run_current: 0.9
#hold_current: 0.3
sense_resistor: 0.10
#stealthchop_threshold: 12000

[tmc2209 stepper_y]
uart_pin: PA4
interpolate: True
run_current: 0.9
#hold_current: 0.3
sense_resistor: 0.10
#stealthchop_threshold: 12000

[tmc2209 stepper_z]
uart_pin: PC5
interpolate: True
run_current: 0.6
hold_current: 0.6
sense_resistor: 0.10
#stealthchop_threshold: 999999

[tmc2209 extruder]
uart_pin: eboard:PB10
interpolate: True
run_current: 0.8
hold_current: 0.8
sense_resistor: 0.10
#stealthchop_threshold: 999999

# -- Load cell (Z probe amplifier) + TVOC, as STANDARD Klipper sensors ---------
# This is the stock/ZMod form (vanilla-supported) — NOT the xblax flashforge_loadcell
# custom module. The load cell is read as a MAX31856 thermocouple amp; TVOC as a
# MAX31865 RTD amp. The three level_hN pins + level_clear drive the bed-leveling
# mechanism (the actual leveling sequence lives in the macros).
[output_pin level_h1]
pin: PG2
value: 0

[output_pin level_h2]
pin: PG3
value: 0

[output_pin level_h3]
pin: PG4
value: 0

[output_pin level_clear]
pin: PD10
value: 0

[temperature_sensor weightValue]
sensor_type: MAX31856
sensor_pin: PD5
#spi_bus: spi4
spi_speed: 1000000
spi_software_sclk_pin: PD6
spi_software_mosi_pin: PD7
spi_software_miso_pin: PD8
min_temp: 0
max_temp: 2048
gcode_id: W

[temperature_sensor tvocValue]
sensor_type: MAX31865
sensor_pin: PD4
#spi_bus: spi4
#cs_pin: PD0
spi_speed: 500000
spi_software_sclk_pin: PE3
spi_software_mosi_pin: PE4
spi_software_miso_pin: PE5
min_temp: 0
max_temp: 2048
gcode_id: V

[gcode_button check_level_pin]
pin: !PE0
press_gcode:
    M105

# -- Filament sensors ---------------------------------------------------------
# e1 (unused) must be configured as an input pin or the runout sensor misbehaves.
[gcode_button _e1_sensor_input]
pin: !PE1
press_gcode:
    G4 P0

[filament_switch_sensor runout_sensor]
pause_on_runout: False
switch_pin: !PB14
event_delay: 1.0
runout_gcode:
    _FILAMENT_RUNOUT_EVENT

[servo my_servo]
pin: PC9
maximum_servo_angle: 180
minimum_pulse_width: 0.0005
maximum_pulse_width: 0.0025
initial_angle: 115
#initial_pulse_width:

[gcode_arcs]
resolution: 1.0

[firmware_retraction]
retract_length: 0.8
retract_speed: 35
unretract_extra_length: 0
unretract_speed: 35

[virtual_sdcard]
path: /root/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[display_status]

[exclude_object]

[skew_correction]

# Home order Z, X, Y; move away from the endstop so the bed/head aren't held against
# it (protects the plastic tab in the bed corner).
[homing_override]
gcode:
    M204 S5000
    G28 Z0
    G28 X0
    G28 Y0
    G90
    G1 X105 Y105 Z210 F1800

# -- Bed mesh + Z probe (the load cell, pin !PB4) ------------------------------
# Stock values. [probe] pin !PB4 is the load-cell comparator's digital trigger and
# works as a standard probe pin (no custom module). z_offset is the stock baseline —
# re-probe + SAVE_CONFIG per unit.
[bed_mesh]
speed: 300
horizontal_move_z: 5
move_check_distance: 8
mesh_min: -105, -105
mesh_max: 105, 105
probe_count: 5, 5
mesh_pps: 3, 3
algorithm: bicubic
bicubic_tension: 0.2
#fade_start: 3
#fade_end: 10
#fade_target: 0

[probe]
pin: !PB4
z_offset: -0.25
speed: 5
samples: 3
samples_result: average
samples_tolerance: 0.100
samples_tolerance_retries: 2
