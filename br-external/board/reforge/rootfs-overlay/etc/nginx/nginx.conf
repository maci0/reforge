worker_processes 1;
pid /run/nginx.pid;

events {
    worker_connections 512;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    keepalive_timeout 65;

    # Increase buffer sizes to handle Moonraker API responses
    proxy_buffer_size   128k;
    proxy_buffers       4 256k;
    proxy_busy_buffers_size 256k;

    server {
        listen 80 default_server;
        server_name _;

        # Mainsail static SPA
        root /var/www/mainsail;
        index index.html;

        # SPA fallback — all unknown paths serve index.html so Vue Router works
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Moonraker WebSocket
        location /websocket {
            proxy_pass http://127.0.0.1:7125/websocket;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
        }

        # Moonraker API endpoints
        location ~ ^/(server|printer|api|access|machine|docs)(/.*)?$ {
            proxy_pass http://127.0.0.1:7125;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $http_connection;
        }
    }
}
