name: build
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 0'   # weekly: catch reproducibility regressions
jobs:
  rootfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: install deps
        run: sudo apt-get update && sudo apt-get install -y build-essential qemu-user-static file xz-utils unzip bc cpio rsync
      - name: build rootfs
        run: make rootfs
      - name: smoke test
        run: make smoke
  rootfs-guppy:
    # Full-stack variant: python3+SSL+SQLite, Klipper, Moonraker, Mainsail+nginx,
    # GuppyScreen. Build is heavy (numpy/python/nginx/guppyscreen from source);
    # that is expected and intentional.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: install deps
        run: sudo apt-get update && sudo apt-get install -y build-essential qemu-user-static file xz-utils unzip bc cpio rsync
      - name: build guppy rootfs
        run: make guppy
      - name: smoke-guppy test
        run: make smoke-guppy
  reproducibility:
    # twin-build reproducibility check — heavy (2 full builds), so only on
    # the weekly schedule or manual dispatch, not every push.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: install deps
        run: sudo apt-get update && sudo apt-get install -y build-essential qemu-user-static file xz-utils unzip bc cpio rsync
      - name: reproducibility check
        run: make repro
