name: build
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 0'   # weekly: catch reproducibility regressions
permissions:
  contents: read
jobs:
  lint:
    # ShellCheck our own shell scripts. No submodules: the linter selects from
    # `git ls-files`, so vendor submodules/gitignored trees are excluded anyway.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install host check tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck busybox
      - name: shellcheck
        run: make lint
      - name: host unit checks
        run: make unit
      - name: actionlint (workflow files)
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) >/dev/null 2>&1 || true
          if [ -x ./actionlint ]; then ./actionlint -color || exit 1; else echo "actionlint unavailable — skipping"; fi
  no-blobs:
    # Guard: FAIL if any tracked file path looks like a FlashForge/Qt proprietary
    # blob.  Matches on FILE PATHS only (git ls-files output), not file content —
    # so REPORT.md / scripts that TEXT-mention "firmwareExe" are not caught.
    #
    # Heavy qemu jobs (make qemu-*) are NOT run here — they require sudo + a real
    # ARM kernel + ~10 GB stock rootfs dump and are run locally / in a dedicated
    # lab environment.  See tests/qemu-harness/README.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: no proprietary blobs tracked
        run: |
          # Case-SENSITIVE: the tokens we forbid are fixed-case binary names
          # (firmwareExe, libQtCore.so.5, /opt/PROGRAM/, lab/spike-stockui/extracted/).
          # Earlier this used `grep -iE`, which false-positived against the
          # tracked RE write-ups under docs/reverse-engineering/firmwareexe-*.md
          # (lowercase filenames). Anchored, case-sensitive match avoids that.
          if git ls-files | grep -E \
            'firmwareExe|libQt(Core|Gui|Network)|lab/spike-stockui/extracted/|/opt/PROGRAM/'; then
            echo "ERROR: proprietary blob(s) found in tracked files — see above"
            exit 1
          fi
          echo "no proprietary blobs tracked"
      - name: install deps
        run: sudo apt-get update && sudo apt-get install -y build-essential xz-utils
      - name: packaging smoke (make tgz)
        run: make tgz
  rootfs:
    # Single full ReForge image: python3+SSL+SQLite, Klipper, Moonraker,
    # Mainsail (busybox httpd), GuppyScreen, zram. Build is heavy
    # (numpy/python/guppyscreen from source); that is expected and intentional.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: install deps
        run: sudo apt-get update && sudo apt-get install -y build-essential qemu-user-static file xz-utils unzip bc cpio rsync socat curl
      - name: build rootfs
        run: make rootfs
      - name: smoke test (base rootfs)
        run: make smoke
      - name: smoke test (full stack — guppyscreen/httpd present)
        run: make smoke-guppy
      - name: integration test (python stack — moonraker API live + klippy --import-test)
        # Gates the actual Python runtime: imports moonraker, runs its API, and
        # runs klippy --import-test. This is what catches a broken interpreter
        # (e.g. a stripped stdlib) — the framebuffer/branding smokes do not.
        run: make integration
      - name: release slicer dry-run (per-component zips, no publish)
        # Keeps the OTA release builder green on every PR/push without publishing:
        # slices build/output into klipper/moonraker/guppyscreen/reforge zips +
        # the USB .tgz, then asserts the 4-key release_info.json layout.
        run: |
          tools/release/build-release.sh --no-publish
          tests/release/build-release-test.sh
  reproducibility:
    # twin-build reproducibility check — heavy (2 full builds), so only on
    # the weekly schedule or manual dispatch, not every push.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: install deps
        run: sudo apt-get update && sudo apt-get install -y build-essential qemu-user-static file xz-utils unzip bc cpio rsync
      - name: reproducibility check
        run: make repro
