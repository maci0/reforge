# klipper: pinned to upstream v0.11.0 (release tag, 2022-11-29) to match the
# AD5M / AD5M Pro stock MCU firmware (Klipper v0.11 build, 2023-03-17). Switched
# from master 2026-06-04. The FlashForge fork at FlashForge/AD5M_Series_Klipper
# is byte-identical to this commit except for 6 trivial files (documented in
# docs/research/2026-06-04-klipper-v0.11-fork-deltas.md). Patches carried on
# top of v0.11.0:
#   0001-chelper-disable-runtime-build-check.patch  (defensive guard, matches
#     the FF fork's only meaningful change)
#   0002-py3-configfile-read_file.patch              (Python 3.12+ readfp
#     removal blocker; backport of upstream Klipper PR #6388)
#   0003-py3-gcode-regex-raw-string.patch            (Python 3.14 SyntaxError
#     blocker on gcode.py's m112 regex; matches upstream master)
#   0004-toolhead-backport-lookahead-flush-time.patch (backport of upstream
#     commit 16fc46fe5: LOOKAHEAD_FLUSH_TIME 0.250 -> 0.150; same value
#     forge-x ships as fix_enable_e17; reduces 'print stall' corner cases)
#   0005-relax-TRSYNC_TIMEOUT-ffad5m.patch (doubles MCU sync ack window
#     from 25 ms to 50 ms; preempts E0011 communication-timeout shutdowns;
#     same value forge-x ships as fix_enable_e11; no upstream support).
#   0006-stepcompress-bump-queue-start-size.patch (matches the FlashForge
#     fork: QUEUE_START_SIZE 1024 -> 2048; saves one realloc-and-memcpy
#     per stepper queue at startup; ~5-10 KB extra RAM upfront; no
#     upstream support).
#   0007-defer-multiprocessing-imports.patch (on-demand process helpers).
